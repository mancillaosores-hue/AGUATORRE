<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Evita que el navegador guarde en caché una versión vieja del HTML,
     así cuando subas cambios a GitHub, un refresh (F5) siempre trae
     la última versión publicada. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AguaTorre 💧</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .fade-in { animation: fadeIn .35s ease-in-out; }
  @keyframes fadeIn { from {opacity:0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }
</style>
</head>
<body class="bg-gradient-to-b from-sky-50 to-blue-100 min-h-screen">

<!-- ============ CONFIGURACIÓN SUPABASE ============ -->
<script>
  const SUPABASE_URL = "https://xpitfiunwxvuxqejrdgc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ySWTY_Mnf82zbAxegBR1hA_62CX7t9M";
  // PIN simple para entrar al panel de administrador (cámbialo cuando quieras)
  const ADMIN_PIN = "2026";

  // Nota: desactivamos persistSession/autoRefreshToken/detectSessionInUrl porque
  // esta app no usa el sistema de Auth de Supabase (usamos nuestra propia tabla
  // "clientes"). Esto evita que la librería intente usar localStorage internamente,
  // lo cual falla en navegadores/iframes con restricciones de sandbox.
  let supabaseClient;
  try {
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('La librería de Supabase no cargó (revisa tu conexión a internet o bloqueadores de script).');
    }
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    });
  } catch (e) {
    console.error('Error creando cliente Supabase:', e);
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('app').innerHTML = `<div style="background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c;border-radius:12px;padding:16px;margin-top:24px;font-size:14px;">
        <b>Error al inicializar la conexión:</b><br>${e.message}
      </div>`;
    });
  }
</script>

<div id="app" class="max-w-md mx-auto p-4"></div>

<script>
const app = document.getElementById('app');
const LS_KEY = 'aguatorre_cliente_id';
const NOMBRE_KEY = 'aguatorre_mi_nombre';
const ADMIN_SESSION_KEY = 'aguatorre_admin_session';

// ---------------------------------------------------------
// Almacenamiento seguro: usa localStorage si está disponible,
// si no (p.ej. navegador en modo sandbox/iframe restringido),
// usa una variable en memoria como respaldo para que la app
// siga funcionando durante la sesión.
// ---------------------------------------------------------
const memoryStore = {};
const safeStorage = {
  getItem(key) {
    try { return window.localStorage.getItem(key); }
    catch (e) { return memoryStore[key] || null; }
  },
  setItem(key, value) {
    try { window.localStorage.setItem(key, value); }
    catch (e) { memoryStore[key] = value; }
  },
  removeItem(key) {
    try { window.localStorage.removeItem(key); }
    catch (e) { delete memoryStore[key]; }
  }
};

// ---------------------------------------------------------
// Reglas de puntos / niveles (ajusta a gusto)
// ---------------------------------------------------------
const BIDONES_PARA_PREMIO = 10; // cada 10 bidones = 1 gratis
function nivelDe(bidones) {
  if (bidones >= 100) return { nombre: 'Platino', emoji: '💎', color: 'bg-indigo-500' };
  if (bidones >= 50)  return { nombre: 'Oro',      emoji: '🥇', color: 'bg-yellow-500' };
  if (bidones >= 20)  return { nombre: 'Plata',    emoji: '🥈', color: 'bg-slate-400' };
  return                     { nombre: 'Bronce',  emoji: '🥉', color: 'bg-orange-400' };
}

// ---------------------------------------------------------
// Router simple
// ---------------------------------------------------------
async function init() {
  try {
    // Si ya había una sesión de administrador activa, la mantenemos
    // aunque se refresque la página (hasta que haga "Cerrar sesión").
    if (safeStorage.getItem(ADMIN_SESSION_KEY) === 'true') {
      return renderAdmin();
    }

    const clienteId = safeStorage.getItem(LS_KEY);
    if (clienteId) {
      const { data, error } = await supabaseClient.from('clientes').select('*').eq('id', clienteId).single();
      if (data && !error) return renderDashboardCliente(data);
      safeStorage.removeItem(LS_KEY);
    }
    renderLogin();
  } catch (err) {
    console.error('Error en init:', err);
    app.innerHTML = `<div class="bg-red-50 border border-red-300 text-red-700 rounded-xl p-4 mt-6 text-sm">
      <b>Error al conectar con la base de datos:</b><br>${err.message || JSON.stringify(err)}
    </div>`;
  }
}

// ---------------------------------------------------------
// PANTALLA: Login / Registro
// ---------------------------------------------------------
function renderLogin() {
  app.innerHTML = `
    <div class="fade-in text-center pt-10">
      <div class="text-6xl mb-2">💧</div>
      <h1 class="text-3xl font-extrabold text-blue-700">AguaTorre</h1>
      <p class="text-slate-500 mt-1 mb-8">Pide tu agua sin bajar al primer piso</p>
    </div>
    <div class="bg-white rounded-2xl shadow-lg p-6 fade-in">
      <h2 class="font-semibold text-lg mb-1 text-slate-700">Ingresa tus datos</h2>
      <p class="text-xs text-slate-400 mb-4">Todos los miembros de un mismo depto usan la <b>misma clave</b> para compartir historial y puntos.</p>
      <div class="space-y-3">
        <input id="in-nombre" type="text" placeholder="Tu nombre (quién pide hoy)" class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <div class="flex gap-3">
          <input id="in-torre" type="text" placeholder="N° Torre" class="w-1/2 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <input id="in-depto" type="text" placeholder="N° Depto" class="w-1/2 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <input id="in-clave" type="password" placeholder="Clave del depto (la inventas tú la 1ª vez)" class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <button id="btn-entrar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-3 transition">Ingresar 🚪</button>
        <p id="login-error" class="text-red-500 text-sm hidden"></p>
      </div>
    </div>
    <div class="text-center mt-6">
      <button id="btn-admin" class="text-xs text-slate-400 underline">Soy administrador</button>
    </div>
  `;

  document.getElementById('btn-entrar').addEventListener('click', handleLogin);
  document.getElementById('btn-admin').addEventListener('click', handleAdminAccess);
}

async function handleLogin() {
  const nombre = document.getElementById('in-nombre').value.trim();
  const torre = document.getElementById('in-torre').value.trim();
  const depto = document.getElementById('in-depto').value.trim();
  const clave = document.getElementById('in-clave').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-entrar');
  errEl.classList.add('hidden');

  if (!nombre || !torre || !depto || !clave) {
    errEl.textContent = 'Por favor completa nombre, torre, depto y clave.';
    errEl.classList.remove('hidden');
    return;
  }

  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Cargando...';

  try {
    // El depto (Torre + N° Depto) es la unidad que comparte historial y
    // puntos entre todos los miembros de la familia. Buscamos por
    // torre + depto (ya NO por nombre), y validamos la clave del depto.
    const { data: existentes, error: errBusca } = await supabaseClient
      .from('clientes')
      .select('*')
      .eq('torre', torre)
      .eq('depto', depto)
      .limit(1);

    if (errBusca) throw errBusca;

    let cliente;
    if (existentes && existentes.length > 0) {
      cliente = existentes[0];

      if (!cliente.clave) {
        // Cuenta creada antes de tener clave (o primera vez que alguien
        // la protege): se "reclama" con la clave que acaba de ingresar.
        const { data: actualizado, error: errClaim } = await supabaseClient
          .from('clientes')
          .update({ clave })
          .eq('id', cliente.id)
          .select()
          .single();
        if (errClaim) throw errClaim;
        cliente = actualizado;
      } else if (cliente.clave !== clave) {
        errEl.textContent = `Clave incorrecta para Torre ${torre}, Depto ${depto}. Pregunta a algún familiar por la clave, o contacta al administrador.`;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = textoOriginal;
        return;
      }
    } else {
      // Primera vez que se registra este depto: se crea junto a su clave.
      const { data: nuevo, error: errCrea } = await supabaseClient
        .from('clientes')
        .insert({ nombre, torre, depto, clave })
        .select()
        .single();
      if (errCrea) throw errCrea;
      cliente = nuevo;
    }

    safeStorage.setItem(LS_KEY, cliente.id);
    safeStorage.setItem(NOMBRE_KEY, nombre);
    renderDashboardCliente(cliente);
  } catch (err) {
    console.error('Error en login:', err);
    errEl.textContent = 'Error: ' + (err.message || JSON.stringify(err));
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

function handleAdminAccess() {
  const pin = prompt('Ingresa el PIN de administrador:');
  if (pin === ADMIN_PIN) {
    safeStorage.setItem(ADMIN_SESSION_KEY, 'true');
    renderAdmin();
  } else if (pin !== null) {
    alert('PIN incorrecto.');
  }
}

// ---------------------------------------------------------
// PANTALLA: Dashboard del cliente
// ---------------------------------------------------------
async function renderDashboardCliente(cliente) {
  const nivel = nivelDe(cliente.bidones_totales);
  const progreso = cliente.bidones_totales % BIDONES_PARA_PREMIO;
  const faltan = BIDONES_PARA_PREMIO - progreso;
  const pct = Math.round((progreso / BIDONES_PARA_PREMIO) * 100);

  const { data: pedidos } = await supabaseClient
    .from('pedidos')
    .select('*')
    .eq('cliente_id', cliente.id)
    .order('created_at', { ascending: false })
    .limit(10);

  const historialHtml = (pedidos && pedidos.length > 0)
    ? pedidos.map(p => `
        <div class="flex justify-between items-center border-b py-2 text-sm">
          <div>
            <div class="font-medium text-slate-700">${p.cantidad} bidón(es) ${p.tipo_bidon}</div>
            <div class="text-slate-400 text-xs">${new Date(p.created_at).toLocaleDateString('es-CL', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })} · ${p.metodo_pago}${p.nombre_solicitante ? ' · pidió ' + p.nombre_solicitante : ''}</div>
          </div>
          <span class="px-2 py-1 rounded-full text-xs font-semibold ${estadoColor(p.estado)}">${estadoLabel(p.estado)}</span>
        </div>`).join('')
    : `<p class="text-slate-400 text-sm text-center py-4">Aún no tienes pedidos 💧</p>`;

  const miNombre = safeStorage.getItem(NOMBRE_KEY) || cliente.nombre;

  app.innerHTML = `
    <div class="fade-in flex justify-between items-start pt-4 mb-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-700">Hola, ${miNombre} 👋</h1>
        <p class="text-slate-500 text-sm">Torre ${cliente.torre} · Depto ${cliente.depto} <span class="text-slate-400">(historial compartido)</span></p>
      </div>
      <button id="btn-salir" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-500 px-3 py-1.5 rounded-lg">Cerrar sesión 🔒</button>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 mb-4 fade-in">
      <div class="flex justify-between items-center mb-2">
        <span class="font-semibold text-slate-700">${nivel.emoji} Nivel ${nivel.nombre}</span>
        <span class="text-sm text-slate-500">${cliente.bidones_totales} bidones en total</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
        <div class="${nivel.color} h-3 rounded-full transition-all" style="width:${pct}%"></div>
      </div>
      <p class="text-xs text-slate-500 mt-2">🎁 Te faltan <b>${faltan} bidón(es)</b> para tu próximo bidón gratis</p>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 mb-4 fade-in">
      <h2 class="font-semibold text-slate-700 mb-3">Hacer un pedido 🛒</h2>
      <div class="space-y-3">
        <div class="flex gap-3">
          <input id="ped-cantidad" type="number" min="1" value="1" placeholder="Cantidad" class="w-1/2 border rounded-xl px-3 py-2">
          <select id="ped-tipo" class="w-1/2 border rounded-xl px-3 py-2">
            <option value="20L">Bidón 20L</option>
            <option value="12L">Bidón 12L</option>
          </select>
        </div>
        <select id="ped-pago" class="w-full border rounded-xl px-3 py-2">
          <option value="efectivo">Pago en efectivo</option>
          <option value="transferencia">Pago por transferencia</option>
        </select>
        <button id="btn-pedir" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-3 transition">Enviar pedido 🚚</button>
        <p id="pedido-msg" class="text-sm text-center hidden"></p>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 mb-8 fade-in">
      <h2 class="font-semibold text-slate-700 mb-2">Mis últimos pedidos</h2>
      ${historialHtml}
    </div>
  `;

  document.getElementById('btn-salir').addEventListener('click', () => {
    if (!confirm('¿Cerrar sesión? La próxima vez tendrás que ingresar Torre, Depto y Clave de nuevo.')) return;
    safeStorage.removeItem(LS_KEY);
    safeStorage.removeItem(NOMBRE_KEY);
    renderLogin();
  });

  document.getElementById('btn-pedir').addEventListener('click', () => handleNuevoPedido(cliente));
}

function estadoColor(estado) {
  if (estado === 'pagado') return 'bg-green-100 text-green-700';
  if (estado === 'entregado') return 'bg-blue-100 text-blue-700';
  return 'bg-amber-100 text-amber-700';
}
function estadoLabel(estado) {
  if (estado === 'pagado') return 'Pagado ✅';
  if (estado === 'entregado') return 'Entregado 🚚';
  return 'Pendiente ⏳';
}

async function handleNuevoPedido(cliente) {
  const cantidad = parseInt(document.getElementById('ped-cantidad').value, 10) || 1;
  const tipo = document.getElementById('ped-tipo').value;
  const pago = document.getElementById('ped-pago').value;
  const msgEl = document.getElementById('pedido-msg');

  try {
    const miNombre = safeStorage.getItem(NOMBRE_KEY) || cliente.nombre;
    const { error: errPedido } = await supabaseClient.from('pedidos').insert({
      cliente_id: cliente.id,
      cantidad,
      tipo_bidon: tipo,
      metodo_pago: pago,
      estado: 'pendiente',
      nombre_solicitante: miNombre
    });

    if (errPedido) throw errPedido;

    // Actualizar puntos y total de bidones del cliente
    const nuevoTotal = cliente.bidones_totales + cantidad;
    const { error: errUpdate } = await supabaseClient.from('clientes').update({
      bidones_totales: nuevoTotal,
      puntos: nuevoTotal
    }).eq('id', cliente.id);
    if (errUpdate) throw errUpdate;

    const { data: clienteActualizado } = await supabaseClient.from('clientes').select('*').eq('id', cliente.id).single();
    renderDashboardCliente(clienteActualizado || { ...cliente, bidones_totales: nuevoTotal, puntos: nuevoTotal });
  } catch (err) {
    console.error('Error al crear pedido:', err);
    msgEl.textContent = 'Error: ' + (err.message || JSON.stringify(err));
    msgEl.className = 'text-sm text-center text-red-500';
    msgEl.classList.remove('hidden');
  }
}

// ---------------------------------------------------------
// PANTALLA: Admin
// ---------------------------------------------------------
async function renderAdmin() {
  const { data: pedidos } = await supabaseClient
    .from('pedidos')
    .select('*, clientes(nombre, torre, depto)')
    .order('created_at', { ascending: false })
    .limit(100);

  const { data: clientes } = await supabaseClient
    .from('clientes')
    .select('*')
    .order('bidones_totales', { ascending: false });

  const pendientes = (pedidos || []).filter(p => p.estado !== 'pagado');

  const pedidosHtml = pendientes.length > 0 ? pendientes.map(p => `
    <div class="border rounded-xl p-3 mb-2 flex justify-between items-center">
      <div>
        <div class="font-medium text-slate-700">Torre ${p.clientes?.torre || '?'} Depto ${p.clientes?.depto || '?'} ${p.nombre_solicitante ? '· pidió ' + p.nombre_solicitante : ''}</div>
        <div class="text-xs text-slate-400">${p.cantidad} bidón(es) ${p.tipo_bidon} · ${p.metodo_pago} · ${new Date(p.created_at).toLocaleString('es-CL')}</div>
      </div>
      <div class="flex gap-2">
        ${p.estado === 'pendiente' ? `<button data-id="${p.id}" data-estado="entregado" class="btn-estado text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-lg">Entregado</button>` : ''}
        <button data-id="${p.id}" data-estado="pagado" class="btn-estado text-xs bg-green-100 text-green-700 px-2 py-1 rounded-lg">Pagado</button>
      </div>
    </div>
  `).join('') : `<p class="text-slate-400 text-sm text-center py-4">No hay pedidos pendientes 🎉</p>`;

  const clientesHtml = (clientes || []).map(c => `
    <div class="flex justify-between items-center border-b py-2 text-sm">
      <span class="text-slate-700">${c.nombre} · Torre ${c.torre} Depto ${c.depto}</span>
      <span class="font-semibold text-blue-600">${c.bidones_totales} 💧</span>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="fade-in flex justify-between items-center pt-4 mb-4">
      <h1 class="text-2xl font-bold text-blue-700">Panel Admin 🛠️</h1>
      <button id="btn-volver" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-500 px-3 py-1.5 rounded-lg">Cerrar sesión 🔒</button>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 mb-4 fade-in">
      <h2 class="font-semibold text-slate-700 mb-3">Pedidos pendientes / en curso</h2>
      ${pedidosHtml}
    </div>

    <div class="bg-white rounded-2xl shadow p-5 mb-8 fade-in">
      <h2 class="font-semibold text-slate-700 mb-2">Clientes del condominio (${(clientes||[]).length})</h2>
      ${clientesHtml}
    </div>
  `;

  document.getElementById('btn-volver').addEventListener('click', () => {
    if (!confirm('¿Cerrar sesión de administrador?')) return;
    safeStorage.removeItem(ADMIN_SESSION_KEY);
    renderLogin();
  });
  document.querySelectorAll('.btn-estado').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.getAttribute('data-id');
      const estado = e.target.getAttribute('data-estado');
      await supabaseClient.from('pedidos').update({ estado }).eq('id', id);
      renderAdmin();
    });
  });
}

// ---------------------------------------------------------
init();
</script>
</body>
</html>

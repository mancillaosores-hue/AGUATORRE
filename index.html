<style>

    --agua-azul:#0ea5e9;
    --agua-oscuro:#0c4a6e;

  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #e0f2fe 0%, #f0f9ff 45%, #ffffff 100%);
    color:#0f172a;

  .fade-in{ animation: fadeIn .35s ease-in-out; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .pop-in{ animation: popIn .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn{ from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);} }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:40;

  .bottom-nav .nav-item{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; color:#64748b; padding:6px 0; }
  .bottom-nav .nav-item.active{ color:#0284c7; font-weight:700; }
  .fab-pedir{
    position:absolute; left:50%; top:-22px; transform:translateX(-50%);
    width:56px; height:56px; border-radius:50%;
    background: linear-gradient(135deg,#0ea5e9,#0369a1);

  .sidebar-link{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:14px; color:#475569; font-weight:600; font-size:14px; }
  .sidebar-link.active{ background:#e0f2fe; color:#0369a1; }
  .toast-wrap{ position:fixed; top:14px; left:0; right:0; z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast{ background:#0f172a; color:#fff; padding:10px 18px; border-radius:14px; font-size:13px; font-weight:600; box-shadow:0 10px 24px -8px rgba(0,0,0,.4); }
  .confetti-emoji{ position:fixed; top:-40px; font-size:20px; animation: fall linear forwards; z-index:70; }
  @keyframes fall{ to{ transform: translateY(110vh) rotate(360deg); opacity:.2; } }

  .skeleton{ background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%); background-size:400% 100%; animation: skel 1.4s ease infinite; border-radius:12px; }

<script>
/* ============================================================
   ALMACENAMIENTO SEGURO (localStorage con respaldo en memoria)
   ============================================================ */
const LS_KEY = 'aguatorre_cliente_id';
const NOMBRE_KEY = 'aguatorre_mi_nombre';
const ADMIN_SESSION_KEY = 'aguatorre_admin_session';
const memoryStore = {};
const safeStorage = {
  getItem(key){ try{ return window.localStorage.getItem(key); } catch(e){ return memoryStore[key] || null; } },
  setItem(key, value){ try{ window.localStorage.setItem(key, value); } catch(e){ memoryStore[key] = value; } },
  removeItem(key){ try{ window.localStorage.removeItem(key); } catch(e){ delete memoryStore[key]; } }
};

/* ============================================================
   FORMATEO
   ============================================================ */
function clp(n){ return (n||0).toLocaleString('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }); }
function fechaCorta(iso){ return new Date(iso).toLocaleDateString('es-CL', { day:'2-digit', month:'short' }); }
function fechaHora(iso){ return new Date(iso).toLocaleString('es-CL', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
function hoyStr(){ return new Date().toISOString().slice(0,10); }
function ayerStr(){ const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function uuidCorto(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }

/* ============================================================
   PRECIOS
   ============================================================ */
const PRECIOS_BIDON = { '20L': 2000, '12L': 1500 };

/* ============================================================
   MASCOTA: gota de agua simpática (SVG inline, sin dependencias)
   moods: 'feliz' | 'guiño' | 'fiesta' | 'triste' | 'dormida'
   ============================================================ */
function gotaMascota(size = 64, mood = 'feliz', extraClass = '') {
  const caras = {
    feliz:  `<circle cx="26" cy="42" r="3.4" fill="#0c4a6e"/><circle cx="42" cy="42" r="3.4" fill="#0c4a6e"/><path d="M24 50 Q34 58 44 50" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    guiño:  `<path d="M22 42 L30 42" stroke="#0c4a6e" stroke-width="3.4" stroke-linecap="round"/><circle cx="42" cy="42" r="3.4" fill="#0c4a6e"/><path d="M24 50 Q34 58 44 50" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    fiesta: `<circle cx="26" cy="41" r="3.6" fill="#0c4a6e"/><circle cx="42" cy="41" r="3.6" fill="#0c4a6e"/><path d="M22 49 Q34 62 46 49" stroke="#0c4a6e" stroke-width="3.4" fill="none" stroke-linecap="round"/>`,
    triste: `<circle cx="26" cy="44" r="3.2" fill="#0c4a6e"/><circle cx="42" cy="44" r="3.2" fill="#0c4a6e"/><path d="M24 54 Q34 47 44 54" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    dormida:`<path d="M22 42 Q26 45 30 42" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M38 42 Q42 45 46 42" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M28 52 Q34 55 40 52" stroke="#0c4a6e" stroke-width="3" fill="none" stroke-linecap="round"/>`
  };
  return `
  <svg class="${extraClass}" width="${size}" height="${size}" viewBox="0 0 68 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gotaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7dd3fc"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
    </defs>
    <path d="M34 2 C34 2 4 40 4 58 C4 76 20 78 34 78 C48 78 64 76 64 58 C64 40 34 2 34 2 Z" fill="url(#gotaGrad)"/>
    <ellipse cx="22" cy="24" rx="6" ry="9" fill="#ffffff" opacity=".35"/>
    ${caras[mood] || caras.feliz}
  </svg>`;
}

/* ============================================================
   SISTEMA DE NIVELES ("Gotas") — basado en puntos acumulados
   ============================================================ */
const NIVELES = [
  { min: 0,    nombre: 'Gota Inicial',   emoji:'💧', color:'from-sky-300 to-sky-400' },
  { min: 200,  nombre: 'Gota Activa',    emoji:'💧', color:'from-sky-400 to-cyan-500' },
  { min: 500,  nombre: 'Gota Frecuente', emoji:'💧', color:'from-cyan-500 to-blue-500' },
  { min: 1000, nombre: 'Gota Experta',   emoji:'💧', color:'from-blue-500 to-indigo-500' },
  { min: 2000, nombre: 'Gota Premium',   emoji:'💎', color:'from-indigo-500 to-purple-500' },
  { min: 4000, nombre: 'Gota Leyenda',   emoji:'👑', color:'from-amber-400 to-orange-500' },
];
function infoNivel(puntos){
  puntos = puntos || 0;
  let idx = 0;
  for (let i=0;i<NIVELES.length;i++){ if (puntos >= NIVELES[i].min) idx = i; }
  const actual = NIVELES[idx];
  const siguiente = NIVELES[idx+1] || null;
  const base = actual.min;
  const tope = siguiente ? siguiente.min : base + 1000;
  const pct = siguiente ? Math.min(100, Math.round(((puntos-base)/(tope-base))*100)) : 100;
  return { idx, actual, siguiente, pct, puntos, faltan: siguiente ? (tope - puntos) : 0, tope };
}
const PUNTOS_POR_BIDON = 100;
const PUNTOS_POR_RACHA_DIA = 20;
const PUNTOS_POR_REFERIDO_INVITADOR = 200;
const PUNTOS_POR_REFERIDO_INVITADO = 100;

/* ============================================================
   ESTADOS DE PEDIDO
   ============================================================ */
const ESTADOS_PEDIDO = ['solicitado','preparando','en_camino','entregado','cancelado'];
function normalizaEstado(estado){
  // Compatibilidad con datos antiguos (antes de este rediseño)
  if (estado === 'pendiente') return 'solicitado';
  if (estado === 'pagado') return 'entregado';
  if (!estado) return 'solicitado';
  return estado;
}
function estadoLabel(estadoRaw){
  const estado = normalizaEstado(estadoRaw);
  const map = {
    solicitado: 'Solicitado 📝',
    preparando: 'Preparando 📦',
    en_camino: 'En camino 🚚',
    entregado: 'Entregado ✅',
    cancelado: 'Cancelado ❌'
  };
  return map[estado] || estado;
}
function estadoColor(estadoRaw){
  const estado = normalizaEstado(estadoRaw);
  const map = {
    solicitado: 'bg-amber-100 text-amber-700',
    preparando: 'bg-orange-100 text-orange-700',
    en_camino: 'bg-blue-100 text-blue-700',
    entregado: 'bg-green-100 text-green-700',
    cancelado: 'bg-red-100 text-red-700'
  };
  return map[estado] || 'bg-slate-100 text-slate-600';
}

/* ============================================================
   TOASTS Y MICROANIMACIONES
   ============================================================ */
function showToast(msg, ms=2600){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast pop-in';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(), 300); }, ms);
}
function lanzarConfeti(emoji='💧', cantidad=14){
  for (let i=0;i<cantidad;i++){
    const el = document.createElement('div');
    el.className = 'confetti-emoji';
    el.textContent = emoji;
    el.style.left = Math.random()*100 + 'vw';
    el.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    el.style.fontSize = (14 + Math.random()*14) + 'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3200);
  }
}
function emptyState(emoji, titulo, subtitulo){
  return `
  <div class="text-center py-10 fade-in">
    <div class="text-5xl mb-3">${emoji}</div>
    <p class="font-semibold text-slate-600">${titulo}</p>
    ${subtitulo ? `<p class="text-sm text-slate-400 mt-1">${subtitulo}</p>` : ''}
  </div>`;
}
</script>
<script>
/* ============================================================
   ROUTER (hash-based) + SESIÓN
   ============================================================ */
let CLIENTE_ACTUAL = null; // se carga en init()

function irA(ruta){ location.hash = ruta; }

window.addEventListener('hashchange', () => router());

async function router(){
  const hash = location.hash.replace(/^#\/?/, '') || '';
  const partes = hash.split('/').filter(Boolean);

  // --- Rutas de administrador (protegidas) ---
  if (partes[0] === 'admin') {
    if (safeStorage.getItem(ADMIN_SESSION_KEY) !== 'true') {
      showToast('🔒 Acceso restringido: inicia sesión como administrador.');
      irA(''); return;
    }
    const seccion = partes[1] || 'resumen';
    return renderAdmin(seccion);
  }

  // --- Si hay sesión de admin activa y no se pidió una ruta de cliente, mostrar admin ---
  if (!hash && safeStorage.getItem(ADMIN_SESSION_KEY) === 'true') {
    return renderAdmin('resumen');
  }

  // --- Rutas de cliente: requieren sesión ---
  const clienteId = safeStorage.getItem(LS_KEY);
  if (!clienteId) { return renderLogin(); }

  if (!CLIENTE_ACTUAL || CLIENTE_ACTUAL.id !== clienteId) {
    const { data, error } = await supabaseClient.from('clientes').select('*').eq('id', clienteId).single();
    if (error || !data) { safeStorage.removeItem(LS_KEY); return renderLogin(); }
    CLIENTE_ACTUAL = data;
  }

  const ruta = partes[0] || 'home';
  switch(ruta){
    case 'home': return renderHome(CLIENTE_ACTUAL);
    case 'pedido':
      if (partes[1] === 'nuevo') return renderNuevoPedido(CLIENTE_ACTUAL);
      if (partes[1]) return renderSeguimiento(CLIENTE_ACTUAL, partes[1]);
      return renderHome(CLIENTE_ACTUAL);
    case 'historial': return renderHistorial(CLIENTE_ACTUAL);
    case 'puntos': return renderPuntos(CLIENTE_ACTUAL);
    case 'notificaciones': return renderNotificaciones(CLIENTE_ACTUAL);
    case 'perfil': return renderPerfil(CLIENTE_ACTUAL);
    case 'referidos': return renderReferidos(CLIENTE_ACTUAL);
    default: return renderHome(CLIENTE_ACTUAL);
  }
}

async function recargarClienteActual(){
  if (!CLIENTE_ACTUAL) return null;
  const { data } = await supabaseClient.from('clientes').select('*').eq('id', CLIENTE_ACTUAL.id).single();
  if (data) CLIENTE_ACTUAL = data;
  return CLIENTE_ACTUAL;
}

/* ============================================================
   SHELL DE CLIENTE: bottom-nav (móvil) + sidebar (escritorio)
   ============================================================ */
function shellCliente(contenidoHtml, activo){
  const items = [
    { id:'home', label:'Inicio', icon:'🏠', ruta:'#/home' },
    { id:'historial', label:'Pedidos', icon:'📦', ruta:'#/historial' },
    { id:'pedir', label:'Pedir', icon:'💧', ruta:'#/pedido/nuevo' },
    { id:'puntos', label:'Puntos', icon:'⭐', ruta:'#/puntos' },
    { id:'perfil', label:'Perfil', icon:'👤', ruta:'#/perfil' },
  ];
  const navMobile = `
    <div class="bottom-nav safe-bottom md:hidden">
      <div class="relative grid grid-cols-5 max-w-md mx-auto">
        ${items.map(it => it.id === 'pedir' ? `
          <a href="${it.ruta}" class="nav-item relative">
            <div class="fab-pedir">💧</div>
            <span class="mt-8 ${activo===it.id?'text-sky-600 font-bold':''}">${it.label}</span>
          </a>` : `
          <a href="${it.ruta}" class="nav-item ${activo===it.id?'active':''}">
            <span class="text-lg">${it.icon}</span><span>${it.label}</span>
          </a>`).join('')}
      </div>
    </div>`;
  const sidebarDesktop = `
    <div class="hidden md:flex md:flex-col md:w-56 md:shrink-0 md:pr-4 md:sticky md:top-6 md:self-start">
      <div class="flex items-center gap-2 px-2 mb-6 mt-6">
        <span class="text-3xl">💧</span>
        <span class="font-extrabold text-xl text-sky-700">AguaTorre</span>
      </div>
      <nav class="space-y-1">
        ${items.map(it => `<a href="${it.ruta}" class="sidebar-link ${activo===it.id?'active':''}"><span class="text-lg">${it.icon}</span>${it.label}</a>`).join('')}
        <a href="#/notificaciones" class="sidebar-link ${activo==='notificaciones'?'active':''}"><span class="text-lg">🔔</span>Notificaciones</a>
        <a href="#/referidos" class="sidebar-link ${activo==='referidos'?'active':''}"><span class="text-lg">🤝</span>Invitar vecinos</a>
      </nav>
    </div>`;
  return `
    <div class="md:flex md:gap-4 md:items-start">
      ${sidebarDesktop}
      <div class="flex-1 min-w-0 px-4 md:px-0 md:pt-6">
        ${contenidoHtml}
      </div>
    </div>
    ${navMobile}
  `;
}

function headerSecundario(titulo, rutaVolver='#/home'){
  return `
    <div class="flex items-center gap-3 pt-4 mb-4 fade-in">
      <a href="${rutaVolver}" class="w-9 h-9 flex items-center justify-center rounded-full bg-white shadow text-slate-500">←</a>
      <h1 class="text-xl font-bold text-slate-800">${titulo}</h1>
    </div>`;
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  try {
    if (!location.hash) {
      if (safeStorage.getItem(ADMIN_SESSION_KEY) === 'true') { location.hash = '#/admin'; return; }
      const clienteId = safeStorage.getItem(LS_KEY);
      if (clienteId) { location.hash = '#/home'; return; }
    }
    await router();
  } catch (err) {
    console.error('Error en init:', err);
    app.innerHTML = `<div class="m-4 bg-red-50 border border-red-300 text-red-700 rounded-2xl p-4 text-sm">
      <b>Error al conectar con la base de datos:</b><br>${err.message || JSON.stringify(err)}
    </div>`;
  }
}
</script>
<script>

      <p class="text-xs text-slate-400 mb-4">Solo pueden registrarse residentes autorizados de la comunidad. Todos los integrantes de un mismo depto comparten historial y puntos con la <b>misma clave</b>.</p>
      <div class="space-y-3">
        <div class="flex gap-3">
          <input id="in-nombre" type="text" placeholder="Nombre" class="w-1/2 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400">

          <input id="in-correo" type="email" placeholder="Correo (opcional)" class="w-1/2 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400">
        </div>
        <div class="flex gap-3">
          <input id="in-torre" type="text" placeholder="N° Torre" class="w-1/2 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400">
          <input id="in-depto" type="text" placeholder="N° Depto" class="w-1/2 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400">
        </div>
        <input id="in-clave" type="password" placeholder="Clave del depto (la inventas tú la 1ª vez)" class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-400">
        <label class="flex items-center gap-2 text-xs text-slate-500 px-1">
          <input id="in-recordar" type="checkbox" checked class="rounded"> Mantener sesión iniciada en este dispositivo
        </label>
        <button id="btn-entrar" class="w-full btn-primary py-3">Ingresar 🚪</button>
        <p id="login-error" class="text-red-500 text-sm hidden"></p>
      </div>
    </div>
    <div class="text-center mt-6 pb-6">
      <button id="btn-admin" class="text-xs text-slate-400 underline">¿Eres administrador?</button>
    </div>
  `;
  document.getElementById('btn-entrar').addEventListener('click', () => handleLogin(refCode));
  document.getElementById('btn-admin').addEventListener('click', handleAdminAccess);
}

async function handleLogin(refCode){
  const nombre = document.getElementById('in-nombre').value.trim();
  const apellido = document.getElementById('in-apellido').value.trim();
  const telefono = document.getElementById('in-telefono').value.trim();
  const correo = document.getElementById('in-correo').value.trim();
  const torre = document.getElementById('in-torre').value.trim();
  const depto = document.getElementById('in-depto').value.trim();
  const clave = document.getElementById('in-clave').value.trim();
  const recordar = document.getElementById('in-recordar').checked;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-entrar');
  errEl.classList.add('hidden');
  if (!nombre || !torre || !depto || !clave) {
    errEl.textContent = 'Por favor completa al menos nombre, torre, depto y clave.';
    errEl.classList.remove('hidden');
    return;
  }
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Cargando...';
  try {
    const { data: existentes, error: errBusca } = await supabaseClient
      .from('clientes').select('*').eq('torre', torre).eq('depto', depto).limit(1);
    if (errBusca) throw errBusca;
    let cliente;
    let esNuevo = false;
    if (existentes && existentes.length > 0) {
      cliente = existentes[0];
      if (!cliente.clave) {
        const { data: actualizado, error: errClaim } = await supabaseClient
          .from('clientes').update({ clave, apellido, telefono, correo }).eq('id', cliente.id).select().single();
        if (errClaim) throw errClaim;
        cliente = actualizado;
      } else if (cliente.clave !== clave) {
        errEl.textContent = `Clave incorrecta para Torre ${torre}, Depto ${depto}. Pregunta a algún familiar por la clave, o contacta al administrador.`;
        errEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = textoOriginal;
        return;
      }
    } else {
      const codigo_referido = uuidCorto();
      const { data: nuevo, error: errCrea } = await supabaseClient
        .from('clientes')
        .insert({ nombre, apellido, telefono, correo, torre, depto, clave, codigo_referido, bidones_totales:0, puntos:0, racha_actual:0 })
        .select().single();
      if (errCrea) throw errCrea;
      cliente = nuevo;
      esNuevo = true;
    }
    if (esNuevo && refCode) { await procesarReferido(refCode, cliente).catch(e=>console.warn('Referido no procesado:', e)); }
    safeStorage.setItem(LS_KEY, cliente.id);
    safeStorage.setItem(NOMBRE_KEY, nombre);
    if (!recordar) { /* la sesión igual queda en localStorage por límites del entorno, pero se respeta la preferencia visualmente */ }
    CLIENTE_ACTUAL = cliente;
    location.hash = '#/home';
    router();
  } catch (err) {
    console.error('Error en login:', err);
    errEl.textContent = 'Error: ' + (err.message || JSON.stringify(err));
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}

async function procesarReferido(codigo, clienteNuevo){
  const { data: invitador } = await supabaseClient.from('clientes').select('*').eq('codigo_referido', codigo).limit(1).single();
  if (!invitador || invitador.id === clienteNuevo.id) return;
  await supabaseClient.from('referidos').insert({
    cliente_invitador_id: invitador.id, cliente_invitado_id: clienteNuevo.id, puntos_otorgados: PUNTOS_POR_REFERIDO_INVITADOR
  });
  await supabaseClient.from('clientes').update({ puntos: (invitador.puntos||0) + PUNTOS_POR_REFERIDO_INVITADOR }).eq('id', invitador.id);
  await supabaseClient.from('clientes').update({ puntos: (clienteNuevo.puntos||0) + PUNTOS_POR_REFERIDO_INVITADO }).eq('id', clienteNuevo.id);
  await crearNotificacion(invitador.id, 'referido', `🤝 ¡${clienteNuevo.nombre} se unió con tu código! Ganaste ${PUNTOS_POR_REFERIDO_INVITADOR} puntos.`);
  await crearNotificacion(clienteNuevo.id, 'referido', `🎉 ¡Bienvenido! Ganaste ${PUNTOS_POR_REFERIDO_INVITADO} puntos por unirte con una invitación.`);
}

function handleAdminAccess(){
  const pin = prompt('Ingresa el PIN de administrador:');
  if (pin === ADMIN_PIN) {
    safeStorage.setItem(ADMIN_SESSION_KEY, 'true');
    location.hash = '#/admin';
    router();
  } else if (pin !== null) {
    showToast('❌ PIN incorrecto.');
  }
}
</script>

<script>
/* ============================================================
   PANTALLA: CREAR PEDIDO (wizard de 4 pasos)
   ============================================================ */
let PEDIDO_WIZ = { paso:1, cantidad:1, tipo:'20L', depto: null, torre: null, horario:'asap', fecha_programada:'', indicaciones:'', pago:'efectivo' };

function renderNuevoPedido(cliente){
  PEDIDO_WIZ = { paso:1, cantidad:1, tipo:'20L', torre: cliente.torre, depto: cliente.depto, horario:'asap', fecha_programada:'', indicaciones:'', pago:'efectivo' };
  pintarPasoPedido(cliente);
}

function pintarPasoPedido(cliente){
  const w = PEDIDO_WIZ;
  const precio = PRECIOS_BIDON[w.tipo] || 0;
  const total = precio * w.cantidad;
  const pasos = ['¿Qué necesitas?','¿Dónde lo entregamos?','¿Cuándo lo quieres?','Indicaciones'];

  let contenido = '';
  if (w.paso === 1) {
    contenido = `
      <div class="card p-5 fade-in">
        <label class="text-sm font-semibold text-slate-600 mb-2 block">Bidón</label>
        <div class="grid grid-cols-2 gap-3 mb-4">
          ${['20L','12L'].map(t => `
            <button data-tipo="${t}" class="btn-tipo ${w.tipo===t?'ring-2 ring-sky-500 bg-sky-50':'bg-slate-50'} rounded-2xl p-4 text-center">
              <div class="text-2xl mb-1">💧</div>
              <div class="font-bold text-slate-700">Bidón ${t}</div>
              <div class="text-xs text-slate-500">${clp(PRECIOS_BIDON[t])}</div>
            </button>`).join('')}
        </div>
        <label class="text-sm font-semibold text-slate-600 mb-2 block">Cantidad</label>
        <div class="flex items-center justify-center gap-6 mb-4">
          <button id="btn-menos" class="w-11 h-11 rounded-full bg-slate-100 text-xl font-bold">−</button>
          <span id="lbl-cantidad" class="text-2xl font-extrabold w-10 text-center">${w.cantidad}</span>
          <button id="btn-mas" class="w-11 h-11 rounded-full bg-sky-100 text-sky-700 text-xl font-bold">+</button>
        </div>
        <div class="flex justify-between items-center bg-sky-50 rounded-xl px-4 py-3">
          <span class="text-sm text-slate-600">Total</span>
          <span class="text-lg font-extrabold text-sky-700" id="lbl-total">${clp(total)}</span>
        </div>
      </div>`;
  } else if (w.paso === 2) {
    contenido = `
      <div class="card p-5 fade-in">
        <p class="text-sm text-slate-500 mb-3">Entregamos en tu dirección registrada. Puedes ajustarla si es necesario.</p>
        <div class="flex gap-3">
          <input id="in-torre-p" value="${w.torre}" placeholder="Torre" class="w-1/2 border rounded-xl px-4 py-3">
          <input id="in-depto-p" value="${w.depto}" placeholder="Depto" class="w-1/2 border rounded-xl px-4 py-3">
        </div>
      </div>`;
  } else if (w.paso === 3) {
    const opciones = [
      { v:'asap', label:'Lo antes posible', icon:'⚡' },
      { v:'hoy', label:'Hoy', icon:'📅' },
      { v:'programado', label:'Programar entrega', icon:'🗓️' },
    ];
    contenido = `
      <div class="card p-5 fade-in space-y-2">
        ${opciones.map(o => `
          <button data-horario="${o.v}" class="btn-horario w-full flex items-center gap-3 text-left rounded-xl px-4 py-3 border ${w.horario===o.v?'border-sky-500 bg-sky-50':'border-slate-200'}">
            <span class="text-xl">${o.icon}</span><span class="font-semibold text-slate-700">${o.label}</span>
          </button>`).join('')}
        ${w.horario==='programado' ? `<input id="in-fecha-prog" type="datetime-local" value="${w.fecha_programada}" class="w-full border rounded-xl px-4 py-3 mt-2">` : ''}
      </div>`;
  } else if (w.paso === 4) {
    contenido = `
      <div class="card p-5 fade-in mb-4">
        <label class="text-sm font-semibold text-slate-600 mb-2 block">Indicaciones (opcional)</label>
        <textarea id="in-indicaciones" rows="3" placeholder="Ej: dejar en conserjería." class="w-full border rounded-xl px-4 py-3">${w.indicaciones}</textarea>
        <label class="text-sm font-semibold text-slate-600 mt-3 mb-2 block">Método de pago</label>
        <select id="in-pago" class="w-full border rounded-xl px-4 py-3">
          <option value="efectivo" ${w.pago==='efectivo'?'selected':''}>Pago en efectivo</option>
          <option value="transferencia" ${w.pago==='transferencia'?'selected':''}>Pago por transferencia</option>
        </select>
      </div>
      <div class="card p-5 fade-in">
        <h3 class="font-bold text-slate-700 mb-3">Resumen del pedido</h3>
        <div class="space-y-1.5 text-sm text-slate-600">
          <div class="flex justify-between"><span>Cantidad</span><b>${w.cantidad} × Bidón ${w.tipo}</b></div>
          <div class="flex justify-between"><span>Precio unitario</span><b>${clp(precio)}</b></div>
          <div class="flex justify-between"><span>Dirección</span><b>Torre ${w.torre} · Depto ${w.depto}</b></div>
          <div class="flex justify-between"><span>Horario</span><b>${w.horario==='asap'?'Lo antes posible':w.horario==='hoy'?'Hoy':'Programado'}</b></div>
          <div class="flex justify-between border-t pt-2 mt-2 text-base"><span class="font-bold">Total</span><b class="text-sky-700">${clp(total)}</b></div>
        </div>
      </div>`;
  }

  app.innerHTML = `
    ${headerSecundario('Hacer pedido', '#/home')}
    <div class="px-4">
      <div class="flex items-center gap-1 mb-4">
        ${[1,2,3,4].map(p => `<div class="h-1.5 flex-1 rounded-full ${p<=w.paso?'bg-sky-500':'bg-slate-200'}"></div>`).join('')}
      </div>
      <p class="text-xs font-semibold text-sky-600 mb-1">Paso ${w.paso} de 4</p>
      <h2 class="text-lg font-bold text-slate-800 mb-3">${pasos[w.paso-1]}</h2>
      ${contenido}
      <div class="flex gap-3 mt-5 pb-8">
        ${w.paso>1 ? `<button id="btn-atras" class="btn-ghost flex-1 py-3 font-semibold">Atrás</button>` : ''}
        <button id="btn-siguiente" class="btn-primary flex-1 py-3">${w.paso<4 ? 'Continuar' : 'Confirmar pedido 💧'}</button>
      </div>
    </div>
  `;

  if (w.paso===1){
    document.querySelectorAll('.btn-tipo').forEach(b => b.addEventListener('click', ()=>{ w.tipo = b.getAttribute('data-tipo'); pintarPasoPedido(cliente); }));
    document.getElementById('btn-menos').addEventListener('click', ()=>{ w.cantidad = Math.max(1, w.cantidad-1); pintarPasoPedido(cliente); });
    document.getElementById('btn-mas').addEventListener('click', ()=>{ w.cantidad = Math.min(20, w.cantidad+1); pintarPasoPedido(cliente); });
  }
  if (w.paso===3){
    document.querySelectorAll('.btn-horario').forEach(b => b.addEventListener('click', ()=>{ w.horario = b.getAttribute('data-horario'); pintarPasoPedido(cliente); }));
  }
  if (w.paso>1) document.getElementById('btn-atras').addEventListener('click', ()=>{ guardarPasoActual(); w.paso--; pintarPasoPedido(cliente); });
  document.getElementById('btn-siguiente').addEventListener('click', async ()=>{
    guardarPasoActual();
    if (w.paso < 4) { w.paso++; pintarPasoPedido(cliente); }
    else { await confirmarPedido(cliente); }
  });

  function guardarPasoActual(){
    if (w.paso===2){ w.torre = document.getElementById('in-torre-p').value.trim() || w.torre; w.depto = document.getElementById('in-depto-p').value.trim() || w.depto; }
    if (w.paso===3 && w.horario==='programado'){ const el=document.getElementById('in-fecha-prog'); if (el) w.fecha_programada = el.value; }
    if (w.paso===4){ w.indicaciones = document.getElementById('in-indicaciones').value.trim(); w.pago = document.getElementById('in-pago').value; }
  }
}

async function confirmarPedido(cliente){
  const w = PEDIDO_WIZ;
  const btn = document.getElementById('btn-siguiente');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const precio = PRECIOS_BIDON[w.tipo] || 0;
    const total = precio * w.cantidad;
    const miNombre = safeStorage.getItem(NOMBRE_KEY) || cliente.nombre;
    const { data: pedidoCreado, error: errPedido } = await supabaseClient.from('pedidos').insert({
      cliente_id: cliente.id,
      cantidad: w.cantidad,
      tipo_bidon: w.tipo,
      metodo_pago: w.pago,
      estado: 'solicitado',
      nombre_solicitante: miNombre,
      horario_tipo: w.horario,
      fecha_programada: w.horario==='programado' && w.fecha_programada ? w.fecha_programada : null,
      indicaciones: w.indicaciones || null,
      precio_unitario: precio,
      total: total
    }).select().single();
    if (errPedido) throw errPedido;

    // Puntos, bidones totales y racha
    const ganancia = w.cantidad * PUNTOS_POR_BIDON;
    const nuevoTotalBidones = (cliente.bidones_totales||0) + w.cantidad;
    let nuevaRacha = cliente.racha_actual || 0;
    const hoy = hoyStr();
    if (cliente.ultima_fecha_pedido === hoy) { /* ya cuenta hoy, no cambia */ }
    else if (cliente.ultima_fecha_pedido === ayerStr()) { nuevaRacha = nuevaRacha + 1; }
    else { nuevaRacha = 1; }
    const puntosRacha = (cliente.ultima_fecha_pedido !== hoy) ? PUNTOS_POR_RACHA_DIA : 0;
    const nuevoPuntos = (cliente.puntos||0) + ganancia + puntosRacha;

    const nivelAntes = infoNivel(cliente.puntos).actual.nombre;
    const nivelDespues = infoNivel(nuevoPuntos).actual.nombre;

    await supabaseClient.from('clientes').update({
      bidones_totales: nuevoTotalBidones, puntos: nuevoPuntos, racha_actual: nuevaRacha, ultima_fecha_pedido: hoy
    }).eq('id', cliente.id);

    await crearNotificacion(cliente.id, 'pedido', `📝 Tu pedido #${pedidoCreado.id.toString().slice(0,8).toUpperCase()} fue recibido. ¡Ganaste ${ganancia+puntosRacha} puntos!`);
    if (nivelAntes !== nivelDespues) await crearNotificacion(cliente.id, 'nivel', `🎉 ¡Subiste de nivel! Ahora eres ${nivelDespues}.`);

    await recargarClienteActual();
    lanzarConfeti('💧', 16);
    showToast('¡Pedido recibido! 💧');
    location.hash = `#/pedido/${pedidoCreado.id}`;
    router();
  } catch (err) {
    console.error('Error al crear pedido:', err);
    showToast('Error al enviar el pedido: ' + (err.message || JSON.stringify(err)));
    btn.disabled = false; btn.textContent = 'Confirmar pedido 💧';
  }
}
</script>
<script>
/* ============================================================
   PANTALLA: SEGUIMIENTO DEL PEDIDO
   ============================================================ */
async function renderSeguimiento(cliente, pedidoId){
  app.innerHTML = shellCliente(`${headerSecundario('Seguimiento','#/home')}<div id="seg-content" class="px-0">${skeletonHome()}</div>`, 'home');
  const { data: pedido, error } = await supabaseClient.from('pedidos').select('*, repartidores(*)').eq('id', pedidoId).single();
  const cont = document.getElementById('seg-content');
  if (error || !pedido) { cont.innerHTML = emptyState('❓','No encontramos ese pedido',''); return; }
  const estado = normalizaEstado(pedido.estado);
  const pasos = ['solicitado','preparando','en_camino','entregado'];
  const idxActual = pasos.indexOf(estado);

  const timeline = pasos.map((p, i) => {
    const labels = { solicitado:'Pedido solicitado', preparando:'Pedido preparado', en_camino:'En camino', entregado:'Entregado' };
    const hecho = estado==='cancelado' ? false : i <= idxActual;
    const esActual = i === idxActual && estado!=='cancelado';
    return `
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs ${hecho?'bg-sky-500 text-white':'bg-slate-200 text-slate-400'} ${esActual?'ring-4 ring-sky-100':''}">${hecho?'✓':'○'}</div>

          <p class="font-bold text-slate-700">${r.nombre}</p>
          <p class="text-xs text-slate-500">⭐ ${(r.calificacion||5).toFixed(1)}</p>

        ${r.telefono ? `<a href="tel:${r.telefono}" class="w-10 h-10 rounded-full bg-green-100 text-green-700 flex items-center justify-center">📞</a>` : ''}
      </div>`;

  cont.innerHTML = `
    <div class="px-4">
      <div class="card p-5 mb-4 fade-in">
        <div class="flex justify-between items-start mb-3">
          <div>
            <p class="text-xs text-slate-400">Pedido</p>

      </div>
      ${repartidorHtml}
      <div class="card p-5 mb-6 fade-in">
        <h3 class="font-bold text-slate-700 mb-2">Detalle</h3>
        <div class="space-y-1.5 text-sm text-slate-600">
          <div class="flex justify-between"><span>Cantidad</span><b>${pedido.cantidad} × Bidón ${pedido.tipo_bidon}</b></div>
          <div class="flex justify-between"><span>Total</span><b>${clp(pedido.total || (PRECIOS_BIDON[pedido.tipo_bidon]||0)*pedido.cantidad)}</b></div>
          <div class="flex justify-between"><span>Fecha</span><b>${fechaHora(pedido.created_at)}</b></div>
          ${pedido.indicaciones ? `<div class="flex justify-between"><span>Indicaciones</span><b>${pedido.indicaciones}</b></div>` : ''}
        </div>

  `;
}

/* ============================================================
   PANTALLA: HISTORIAL ("Mis pedidos")
   ============================================================ */
let FILTRO_HISTORIAL = 'todos';
async function renderHistorial(cliente){
  app.innerHTML = shellCliente(`${headerSecundario('Mis pedidos','#/home')}<div id="hist-content" class="px-4">${skeletonHome()}</div>`, 'historial');
  const { data: pedidos } = await supabaseClient.from('pedidos').select('*').eq('cliente_id', cliente.id).order('created_at', { ascending:false });
  pintarHistorial(pedidos || []);
}
function pintarHistorial(pedidos){
  const filtros = [
    { id:'todos', label:'Todos' },
    { id:'en_camino', label:'En camino' },
    { id:'entregado', label:'Completados' },
    { id:'cancelado', label:'Cancelados' },
  ];
  const filtrados = FILTRO_HISTORIAL==='todos' ? pedidos : pedidos.filter(p => normalizaEstado(p.estado) === (FILTRO_HISTORIAL==='en_camino' ? 'en_camino' : FILTRO_HISTORIAL) || (FILTRO_HISTORIAL==='en_camino' && ['preparando','solicitado'].includes(normalizaEstado(p.estado))));

  const lista = filtrados.length>0 ? filtrados.map(p => `
    <a href="#/pedido/${p.id}" class="card p-4 mb-3 flex justify-between items-center block">
      <div>
        <p class="font-semibold text-slate-700 text-sm">#${p.id.toString().slice(0,8).toUpperCase()} · ${p.cantidad} bidón(es) ${p.tipo_bidon}</p>
        <p class="text-xs text-slate-400">${fechaHora(p.created_at)} · ${clp(p.total || (PRECIOS_BIDON[p.tipo_bidon]||0)*p.cantidad)}</p>
      </div>
      <span class="px-2 py-1 rounded-full text-xs font-semibold ${estadoColor(p.estado)}">${estadoLabel(p.estado)}</span>
    </a>`).join('') : emptyState('📦','No hay pedidos en esta categoría','Prueba con otro filtro.');

  document.getElementById('hist-content').innerHTML = `
    <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
      ${filtros.map(f => `<button data-f="${f.id}" class="btn-filtro whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold ${FILTRO_HISTORIAL===f.id?'bg-sky-600 text-white':'bg-white text-slate-500 border'}">${f.label}</button>`).join('')}
    </div>
    ${lista}
  `;
  document.querySelectorAll('.btn-filtro').forEach(b => b.addEventListener('click', ()=>{ FILTRO_HISTORIAL = b.getAttribute('data-f'); pintarHistorial(pedidos); }));
}
</script>
<script>
/* ============================================================
   PANTALLA: PUNTOS Y GAMIFICACIÓN
   ============================================================ */
async function renderPuntos(cliente){
  app.innerHTML = shellCliente(`${headerSecundario('Puntos y niveles','#/home')}<div id="pts-content" class="px-4">${skeletonHome()}</div>`, 'puntos');
  const nivel = infoNivel(cliente.puntos);
  let recompensas = [];
  try { const { data } = await supabaseClient.from('recompensas').select('*').eq('activa', true).order('costo_puntos', { ascending:true }); recompensas = data || []; }
  catch(e){ console.warn('Tabla recompensas no disponible aún.'); }

  const recompensasHtml = recompensas.length>0 ? recompensas.map(r => `
    <div class="card p-4 mb-3 flex items-center justify-between">
      <div>
        <p class="font-bold text-slate-700 text-sm">${iconoRecompensa(r.tipo)} ${r.nombre}</p>
        <p class="text-xs text-slate-500">${r.descripcion||''}</p>
        <p class="text-xs text-sky-600 font-semibold mt-1">${r.costo_puntos} pts</p>
      </div>
      <button data-id="${r.id}" data-costo="${r.costo_puntos}" class="btn-canjear ${cliente.puntos>=r.costo_puntos ? 'btn-primary' : 'btn-ghost opacity-60'} text-xs px-3 py-2">Canjear</button>
    </div>`).join('') : emptyState('🎁','Aún no hay recompensas disponibles','Muy pronto podrás canjear tus puntos aquí.');

  document.getElementById('pts-content').innerHTML = `
    <div class="card p-5 mb-4 text-center fade-in" style="background:linear-gradient(135deg,#0ea5e9,#0369a1)">
      <div class="flex justify-center mb-1">${gotaMascota(60, cliente.puntos>=4000?'fiesta':'feliz')}</div>
      <p class="text-white/90 text-sm">Nivel actual</p>
      <p class="text-2xl font-extrabold text-white">${nivel.actual.emoji} ${nivel.actual.nombre}</p>
      <div class="progress-track h-3 bg-white/30 mt-3"><div class="h-3 rounded-full bg-white" style="width:${nivel.pct}%"></div></div>
      <p class="text-xs text-white/90 mt-2">${nivel.puntos} pts ${nivel.siguiente ? '· faltan ' + nivel.faltan + ' pts para ' + nivel.siguiente.nombre : '· ¡nivel máximo!'}</p>
    </div>

    <div class="card p-5 mb-4 fade-in">
      <h3 class="font-bold text-slate-700 mb-2">Escala de niveles</h3>
      <div class="space-y-2">
        ${NIVELES.map(n => `<div class="flex justify-between text-sm ${n.nombre===nivel.actual.nombre?'font-bold text-sky-700':'text-slate-500'}"><span>${n.emoji} ${n.nombre}</span><span>${n.min}+ pts</span></div>`).join('')}
      </div>
    </div>

    <div class="card p-5 mb-4 fade-in">
      <h3 class="font-bold text-slate-700 mb-2">Cómo ganar puntos</h3>
      <ul class="text-sm text-slate-600 space-y-1.5">
        <li>💧 Hacer un pedido: +${PUNTOS_POR_BIDON} pts por bidón</li>
        <li>🔥 Mantener tu racha activa: +${PUNTOS_POR_RACHA_DIA} pts extra por día</li>
        <li>🤝 Recomendar un vecino: +${PUNTOS_POR_REFERIDO_INVITADOR} pts</li>
        <li>🎉 Participar en promociones y desafíos especiales</li>
      </ul>
    </div>

    <div class="mb-6">
      <h3 class="font-bold text-slate-700 mb-2 px-1">Recompensas</h3>
      ${recompensasHtml}
    </div>
  `;

  document.querySelectorAll('.btn-canjear').forEach(b => b.addEventListener('click', async ()=>{
    const costo = parseInt(b.getAttribute('data-costo'),10);
    if ((cliente.puntos||0) < costo) { showToast('Aún no tienes suficientes puntos 💧'); return; }
    if (!confirm(`¿Canjear esta recompensa por ${costo} puntos?`)) return;
    try {
      await supabaseClient.from('canjes').insert({ cliente_id: cliente.id, recompensa_id: b.getAttribute('data-id'), estado:'pendiente' });
      await supabaseClient.from('clientes').update({ puntos: cliente.puntos - costo }).eq('id', cliente.id);
      await crearNotificacion(cliente.id, 'recompensa', '🎁 ¡Recompensa desbloqueada! Un administrador la validará pronto.');
      await recargarClienteActual();
      lanzarConfeti('🎁', 12);
      showToast('¡Recompensa canjeada! 🎁');
      renderPuntos(CLIENTE_ACTUAL);
    } catch(e){ showToast('No se pudo canjear: ' + (e.message||'')); }
  }));
}
function iconoRecompensa(tipo){ const m = { descuento:'🎁', gratis:'💧', cupon:'🎟️', exclusivo:'⭐' }; return m[tipo] || '🎁'; }

async function renderReferidos(cliente){
  let codigo = cliente.codigo_referido;
  if (!codigo) {
    codigo = uuidCorto();
    await supabaseClient.from('clientes').update({ codigo_referido: codigo }).eq('id', cliente.id);
    await recargarClienteActual();
  }
  let referidos = [];
  try { const { data } = await supabaseClient.from('referidos').select('*').eq('cliente_invitador_id', cliente.id); referidos = data || []; }
  catch(e){ console.warn('Tabla referidos no disponible aún.'); }
  const totalPuntos = referidos.reduce((a,r)=>a+(r.puntos_otorgados||0),0);
  const link = `${location.origin}${location.pathname}#/?ref=${codigo}`;

  app.innerHTML = shellCliente(`
    ${headerSecundario('Invita a tus vecinos','#/home')}
    <div class="px-4">
      <div class="card p-6 mb-4 text-center fade-in">
        <div class="flex justify-center mb-2">${gotaMascota(64,'guiño','wiggle')}</div>
        <p class="font-bold text-slate-700 mb-1">Invita a un vecino a AguaTorre</p>
        <p class="text-sm text-slate-500 mb-4">y ambos reciben puntos 🎉</p>
        <div class="bg-sky-50 rounded-xl py-3 mb-3">
          <p class="text-xs text-slate-500">Tu código personal</p>
          <p class="text-2xl font-extrabold tracking-widest text-sky-700">${codigo}</p>
        </div>
        <button id="btn-compartir" class="w-full btn-primary py-3">Compartir invitación 📤</button>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="card p-4 text-center"><p class="text-xl font-extrabold text-sky-600">${referidos.length}</p><p class="text-xs text-slate-500">Vecinos invitados</p></div>
        <div class="card p-4 text-center"><p class="text-xl font-extrabold text-sky-600">${totalPuntos}</p><p class="text-xs text-slate-500">Puntos obtenidos</p></div>
      </div>
    </div>
  `, 'referidos');

  document.getElementById('btn-compartir').addEventListener('click', async ()=>{
    const texto = `💧 Únete a AguaTorre y pide tu agua sin bajar al primer piso. Usa mi código ${codigo}: ${link}`;
    if (navigator.share) { try { await navigator.share({ title:'AguaTorre', text: texto }); return; } catch(e){} }
    try { await navigator.clipboard.writeText(texto); showToast('Enlace copiado 📋'); } catch(e){ showToast('Copia manual: ' + texto); }
  });
}
</script>
<script>
/* ============================================================

const ADMIN_SECCIONES = [

  { id:'clientes', label:'Clientes', icon:'👥' },

  return `

<script>
/* ============================================================
   ADMIN — RESUMEN
   ============================================================ */
async function renderAdminResumen(){
  const cont = document.getElementById('admin-content');
  const [{ data: pedidos }, { data: clientes }] = await Promise.all([
    supabaseClient.from('pedidos').select('*').order('created_at', { ascending:false }).limit(1000),
    supabaseClient.from('clientes').select('*')
  ]);
  const listaPedidos = pedidos || [];
  const listaClientes = clientes || [];
  const hoy = hoyStr();
  const pedidosHoy = listaPedidos.filter(p => (p.created_at||'').slice(0,10) === hoy);
  const ventasHoy = pedidosHoy.reduce((a,p)=>a+(p.total || (PRECIOS_BIDON[p.tipo_bidon]||0)*p.cantidad),0);
  const bidonesHoy = pedidosHoy.reduce((a,p)=>a+(p.cantidad||0),0);
  const pendientes = listaPedidos.filter(p => !['entregado','cancelado'].includes(normalizaEstado(p.estado))).length;
  const entregadosTotal = listaPedidos.filter(p => normalizaEstado(p.estado)==='entregado').length;
  const entregasATiempo = entregadosTotal>0 ? Math.round((listaPedidos.filter(p=>normalizaEstado(p.estado)==='entregado' && p.hora_entrega).length / entregadosTotal)*100) : 0;
  const clientesActivos = listaClientes.filter(c => (c.bidones_totales||0) > 0).length;

  const cards = [
    { label:'Pedidos de hoy', valor: pedidosHoy.length, icon:'📦' },
    { label:'Ventas de hoy', valor: clp(ventasHoy), icon:'💰' },
    { label:'Bidones vendidos hoy', valor: bidonesHoy, icon:'💧' },
    { label:'Clientes activos', valor: clientesActivos, icon:'👥' },
    { label:'Pedidos pendientes', valor: pendientes, icon:'⏳' },
    { label:'Entregas a tiempo', valor: entregasATiempo + '%', icon:'✅' },
  ];

  cont.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-800 mb-1 fade-in">Resumen general</h1>
    <p class="text-slate-500 text-sm mb-6">Datos en tiempo real desde Supabase.</p>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
      ${cards.map(c => `<div class="card p-4 fade-in"><div class="text-xl mb-1">${c.icon}</div><p class="text-2xl font-extrabold text-slate-800">${c.valor}</p><p class="text-xs text-slate-500">${c.label}</p></div>`).join('')}
    </div>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Ventas últimos 7 días</h3><canvas id="chart-ventas7"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Pedidos por estado</h3><canvas id="chart-estados"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Pedidos por torre</h3><canvas id="chart-torres"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Clientes activos vs. totales</h3><canvas id="chart-clientes"></canvas></div>
    </div>
  `;

  dibujarGraficosResumen(listaPedidos, listaClientes);
}

function ultimosNDias(n){
  const arr = [];
  for (let i=n-1;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}

function dibujarGraficosResumen(pedidos, clientes){
  const dias = ultimosNDias(7);
  const ventasPorDia = dias.map(d => pedidos.filter(p => (p.created_at||'').slice(0,10)===d).reduce((a,p)=>a+(p.total || (PRECIOS_BIDON[p.tipo_bidon]||0)*p.cantidad),0));
  new Chart(document.getElementById('chart-ventas7'), {
    type:'line',
    data:{ labels: dias.map(d=>fechaCorta(d)), datasets:[{ label:'Ventas', data: ventasPorDia, borderColor:'#0284c7', backgroundColor:'rgba(2,132,199,.15)', fill:true, tension:.35 }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });

  const estadosCount = ESTADOS_PEDIDO.map(e => pedidos.filter(p => normalizaEstado(p.estado)===e).length);
  new Chart(document.getElementById('chart-estados'), {
    type:'doughnut',
    data:{ labels:['Solicitado','Preparando','En camino','Entregado','Cancelado'], datasets:[{ data: estadosCount, backgroundColor:['#fbbf24','#fb923c','#38bdf8','#22c55e','#ef4444'] }] },
    options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:10}}}} }
  });

  const torres = [...new Set(clientes.map(c=>c.torre))].filter(Boolean);
  const porTorre = torres.map(t => pedidos.filter(p => (clientes.find(c=>c.id===p.cliente_id)||{}).torre === t).length);
  new Chart(document.getElementById('chart-torres'), {
    type:'bar',
    data:{ labels: torres.map(t=>'Torre '+t), datasets:[{ label:'Pedidos', data: porTorre, backgroundColor:'#0ea5e9', borderRadius:6 }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });

  const activos = clientes.filter(c => (c.bidones_totales||0)>0).length;
  new Chart(document.getElementById('chart-clientes'), {
    type:'doughnut',
    data:{ labels:['Activos','Sin compras aún'], datasets:[{ data:[activos, Math.max(0,clientes.length-activos)], backgroundColor:['#0ea5e9','#e2e8f0'] }] },
    options:{ plugins:{legend:{position:'bottom'}} }
  });
}
</script>

    <div class="card overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="py-2 px-3">Pedido</th><th class="py-2 px-3">Cliente</th><th class="py-2 px-3">Torre</th><th class="py-2 px-3">Depto</th><th class="py-2 px-3">Repartidor</th><th class="py-2 px-3">Estado</th><th class="py-2 px-3">Hora estimada</th><th class="py-2 px-3">Hora entrega</th></tr></thead>
        <tbody>${filas || `<tr><td colspan="8" class="py-8 text-center text-slate-400">No hay entregas activas.</td></tr>`}</tbody>
      </table>
    </div>
  `;

  const btnRep = document.getElementById('btn-crear-rep');
  if (btnRep) btnRep.addEventListener('click', async ()=>{
    const nombre = document.getElementById('in-rep-nombre').value.trim();
    const telefono = document.getElementById('in-rep-telefono').value.trim();
    if (!nombre) { showToast('Ingresa un nombre'); return; }
    try { await supabaseClient.from('repartidores').insert({ nombre, telefono, calificacion:5.0 }); showToast('Repartidor agregado ✅'); renderAdminEntregas(); }
    catch(e){ showToast('No se pudo agregar (¿falta la tabla repartidores?): ' + (e.message||'')); }
  });
  document.querySelectorAll('.sel-repartidor').forEach(sel => sel.addEventListener('change', async ()=>{
    await supabaseClient.from('pedidos').update({ repartidor_id: sel.value || null }).eq('id', sel.getAttribute('data-id'));
    showToast('Repartidor asignado 🚚');
  }));
  document.querySelectorAll('.in-hora-estimada').forEach(inp => inp.addEventListener('change', async ()=>{
    await supabaseClient.from('pedidos').update({ hora_estimada: inp.value }).eq('id', inp.getAttribute('data-id'));
    showToast('Hora estimada guardada ⏱️');
  }));
}
</script>
<script>
/* ============================================================
   ADMIN — GAMIFICACIÓN
   ============================================================ */
async function renderAdminGamificacion(){
  const cont = document.getElementById('admin-content');
  let recompensas = [], canjes = [], referidos = [];
  try { const { data } = await supabaseClient.from('recompensas').select('*').order('costo_puntos'); recompensas = data || []; } catch(e){}
  try { const { data } = await supabaseClient.from('canjes').select('*, clientes(nombre), recompensas(nombre)').order('created_at', { ascending:false }).limit(50); canjes = data || []; } catch(e){}
  try { const { data } = await supabaseClient.from('referidos').select('*'); referidos = data || []; } catch(e){}

  const filasRecompensas = recompensas.map(r => `
    <tr class="border-b hover:bg-slate-50">
      <td class="py-2 px-3 text-sm font-semibold">${iconoRecompensa(r.tipo)} ${r.nombre}</td>
      <td class="py-2 px-3 text-xs text-slate-500">${r.descripcion||'—'}</td>
      <td class="py-2 px-3 text-sm">${r.costo_puntos} pts</td>
      <td class="py-2 px-3"><button data-id="${r.id}" data-activa="${r.activa}" class="btn-toggle-recompensa text-xs px-2 py-1 rounded-full font-semibold ${r.activa?'bg-green-100 text-green-700':'bg-slate-100 text-slate-500'}">${r.activa?'Activa':'Inactiva'}</button></td>
    </tr>`).join('');

  const filasCanjes = canjes.map(c => `
    <tr class="border-b hover:bg-slate-50">
      <td class="py-2 px-3 text-sm">${c.clientes?.nombre||'—'}</td>
      <td class="py-2 px-3 text-sm">${c.recompensas?.nombre||'—'}</td>
      <td class="py-2 px-3 text-xs"><span class="px-2 py-1 rounded-full bg-amber-100 text-amber-700">${c.estado}</span></td>
      <td class="py-2 px-3"><select data-id="${c.id}" class="sel-canje text-xs border rounded-lg px-2 py-1"><option value="pendiente" ${c.estado==='pendiente'?'selected':''}>Pendiente</option><option value="entregado" ${c.estado==='entregado'?'selected':''}>Entregado</option><option value="cancelado" ${c.estado==='cancelado'?'selected':''}>Cancelado</option></select></td>
    </tr>`).join('');

  cont.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-800 mb-1 fade-in">Gamificación</h1>
    <p class="text-slate-500 text-sm mb-4">Administra recompensas, canjes y el impacto del programa de referidos.</p>

    <div class="card p-4 mb-4">
      <h3 class="font-bold text-slate-700 mb-3">Crear nueva recompensa</h3>
      <div class="grid md:grid-cols-4 gap-2">
        <input id="rec-nombre" placeholder="Nombre (ej: 1 bidón gratis)" class="border rounded-lg px-2 py-2 text-sm md:col-span-2">
        <select id="rec-tipo" class="border rounded-lg px-2 py-2 text-sm"><option value="gratis">💧 Pedido gratis</option><option value="descuento">🎁 Descuento</option><option value="cupon">🎟️ Cupón</option><option value="exclusivo">⭐ Exclusivo</option></select>
        <input id="rec-costo" type="number" placeholder="Costo en puntos" class="border rounded-lg px-2 py-2 text-sm">
      </div>
      <input id="rec-desc" placeholder="Descripción breve" class="border rounded-lg px-2 py-2 text-sm w-full mt-2">
      <button id="btn-crear-recompensa" class="btn-primary px-6 py-2 mt-3 text-sm">Crear recompensa</button>
    </div>

    <h3 class="font-bold text-slate-700 mb-2">Recompensas (${recompensas.length})</h3>
    <div class="card overflow-x-auto mb-4">
      <table class="w-full text-left"><thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="py-2 px-3">Recompensa</th><th class="py-2 px-3">Descripción</th><th class="py-2 px-3">Costo</th><th class="py-2 px-3">Estado</th></tr></thead>
      <tbody>${filasRecompensas || `<tr><td colspan="4" class="py-6 text-center text-slate-400">Aún no hay recompensas creadas.</td></tr>`}</tbody></table>
    </div>

    <h3 class="font-bold text-slate-700 mb-2">Canjes recientes (${canjes.length})</h3>
    <div class="card overflow-x-auto mb-4">
      <table class="w-full text-left"><thead class="bg-slate-50 text-xs text-slate-500 uppercase"><tr><th class="py-2 px-3">Cliente</th><th class="py-2 px-3">Recompensa</th><th class="py-2 px-3">Estado</th><th class="py-2 px-3">Actualizar</th></tr></thead>
      <tbody>${filasCanjes || `<tr><td colspan="4" class="py-6 text-center text-slate-400">Aún no hay canjes.</td></tr>`}</tbody></table>
    </div>

    <div class="card p-4">
      <h3 class="font-bold text-slate-700 mb-2">Programa de referidos</h3>
      <p class="text-sm text-slate-600">Total de invitaciones exitosas: <b>${referidos.length}</b></p>
      <p class="text-sm text-slate-600">Puntos entregados por referidos: <b>${referidos.reduce((a,r)=>a+(r.puntos_otorgados||0),0)}</b></p>
    </div>
  `;

  document.getElementById('btn-crear-recompensa').addEventListener('click', async ()=>{
    const nombre = document.getElementById('rec-nombre').value.trim();
    const tipo = document.getElementById('rec-tipo').value;
    const costo = parseInt(document.getElementById('rec-costo').value,10);
    const descripcion = document.getElementById('rec-desc').value.trim();
    if (!nombre || !costo) { showToast('Completa nombre y costo en puntos'); return; }
    try { await supabaseClient.from('recompensas').insert({ nombre, tipo, costo_puntos:costo, descripcion, activa:true }); showToast('Recompensa creada ✅'); renderAdminGamificacion(); }
    catch(e){ showToast('No se pudo crear (¿falta la tabla recompensas?): ' + (e.message||'')); }
  });
  document.querySelectorAll('.btn-toggle-recompensa').forEach(b => b.addEventListener('click', async ()=>{
    const activa = b.getAttribute('data-activa') === 'true';
    await supabaseClient.from('recompensas').update({ activa: !activa }).eq('id', b.getAttribute('data-id'));
    renderAdminGamificacion();
  }));
  document.querySelectorAll('.sel-canje').forEach(sel => sel.addEventListener('change', async ()=>{
    await supabaseClient.from('canjes').update({ estado: sel.value }).eq('id', sel.getAttribute('data-id'));
    showToast('Canje actualizado ✅');
  }));
}

/* ============================================================
   ADMIN — REPORTES
   ============================================================ */
async function renderAdminReportes(){
  const cont = document.getElementById('admin-content');
  const { data: pedidos } = await supabaseClient.from('pedidos').select('*');
  cont.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-800 mb-1 fade-in">Reportes</h1>
    <p class="text-slate-500 text-sm mb-4">Análisis con datos reales de tus pedidos.</p>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Productos vendidos</h3><canvas id="chart-productos"></canvas></div>
      <div class="card p-4"><h3 class="font-bold text-slate-700 mb-2 text-sm">Métodos de pago</h3><canvas id="chart-pagos"></canvas></div>
    </div>
  `;
  const lista = pedidos || [];
  const tipos = ['20L','12L'];
  new Chart(document.getElementById('chart-productos'), {
    type:'bar',
    data:{ labels: tipos.map(t=>'Bidón '+t), datasets:[{ label:'Cantidad vendida', data: tipos.map(t=>lista.filter(p=>p.tipo_bidon===t).reduce((a,p)=>a+(p.cantidad||0),0)), backgroundColor:'#0ea5e9', borderRadius:6 }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
  });
  const pagos = ['efectivo','transferencia'];
  new Chart(document.getElementById('chart-pagos'), {
    type:'pie',
    data:{ labels:['Efectivo','Transferencia'], datasets:[{ data: pagos.map(pg=>lista.filter(p=>p.metodo_pago===pg).length), backgroundColor:['#22c55e','#0ea5e9'] }] },
    options:{ plugins:{legend:{position:'bottom'}} }
  });
}

/* ============================================================
   ADMIN — CONFIGURACIÓN
   ============================================================ */
async function renderAdminConfiguracion(){
  const cont = document.getElementById('admin-content');
  cont.innerHTML = `
    <h1 class="text-2xl font-bold text-slate-800 mb-1 fade-in">Configuración</h1>
    <p class="text-slate-500 text-sm mb-4">Ajustes generales de AguaTorre.</p>
    <div class="card p-5 mb-4">
      <h3 class="font-bold text-slate-700 mb-2">Precios</h3>
      <div class="grid grid-cols-2 gap-3 text-sm text-slate-600">
        <div class="flex justify-between border rounded-xl px-3 py-2"><span>Bidón 20L</span><b>${clp(PRECIOS_BIDON['20L'])}</b></div>
        <div class="flex justify-between border rounded-xl px-3 py-2"><span>Bidón 12L</span><b>${clp(PRECIOS_BIDON['12L'])}</b></div>
      </div>
      <p class="text-xs text-slate-400 mt-2">Para cambiar precios, edita la constante <code>PRECIOS_BIDON</code> en el código.</p>
    </div>
    <div class="card p-5 mb-4">
      <h3 class="font-bold text-slate-700 mb-2">Seguridad</h3>
      <p class="text-sm text-slate-600">El acceso a este panel está protegido por PIN. La migración a Supabase Auth con roles y RLS quedó pospuesta según tu decisión anterior — puedes retomarla cuando quieras.</p>
    </div>
    <div class="card p-5">
      <h3 class="font-bold text-slate-700 mb-2">Acerca de</h3>
      <p class="text-sm text-slate-600">AguaTorre 💧 — El agua de tu torre, ahora mucho más fácil.</p>
    </div>
  `;
}
</script>
<script>
init();
</script>
</body>
